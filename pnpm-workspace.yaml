nodeLinker: hoisted
minimumReleaseAge: 2880 # 2 days
# Skia v3 (Graphite) shipped 2026-10-02; drop this once it's past the release-age window.
minimumReleaseAgeExclude:
  - react-native-skia
  - react-native-skia-graphite-android
  - react-native-skia-graphite-apple-ios
  - react-native-skia-graphite-apple-macos
allowBuilds:
  # Firebase's optional postinstall scripts (telemetry/build helpers); not needed by the app.
  '@firebase/util': false
  protobufjs: false
  '@posthog/cli': true
  '@prisma/engines': true
  esbuild: true
  llama.rn: true
  prisma: true
  unrs-resolver: true
patchedDependencies:
  expo-blur@57.0.3: patches/expo-blur@57.0.3.patch
  react-native-android-widget@0.22.1: patches/react-native-android-widget@0.22.1.patch
  react-native-skia@3.0.1: patches/react-native-skia@3.0.1.patch
